name: selftest

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: py${{ matrix.python-version }} / node${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        # node 版本要跨代测：⑥ 的 JS 校验语义与 node 版本有关 ——
        # node 22 的 `--check` 在 CJS 解析失败时会自动按 ESM 重试（`--experimental-detect-module` 默认开），
        # 因而接受顶层 `await`；node 20 不会。这个差异曾让批量校验误报过，所以要两边都跑。
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 事件 JS 语法校验（check 的 ⑥）需要 node。
      # 没有 node 时 selftest 会跳过对应断言，但那就少守一层 —— 所以这里装上。
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 注意：windows runner 的 stdout 默认是 cp1252（不是 UTF-8）。
      # 本工具输出全是中文，所以这个 job 同时也在守"非 UTF-8 控制台下不崩"。
      # **不要**在这里设 PYTHONUTF8/PYTHONIOENCODING —— 那会把这个问题盖住，CI 就白跑了。
      - name: Run selftest
        run: python scripts/selftest.py

      - name: Smoke test CLI
        run: |
          python scripts/xwl.py --help
          python scripts/xwl.py folders --help

      # 隐私扫描·**结构面**：本机路径（.py）/ 邮箱 / 手机号 / 疑似 token / uid 形状。
      #   这里**不传** `--patterns` —— 外置业务标识清单面**只在本地跑**（真实清单落在仓库之外）。
      #   未传清单时脚本会**显式打印**「本地业务标识清单未参与」，**不静默跳过**；
      #   于是 CI 日志里能直接看到"本次哪一面没跑"，而不是看着全绿却漏了一面。
      - name: Privacy scan（结构面）
        run: python scripts/privacy_scan.py

  # 非 git 布局（模拟平台把 skill 打成 zip、解包后没有 .git）：
  #   默认必须**判红**（静默绿是病根）；显式 `--allow-nogit` 才降级为"打印没扫、rc 按其他项定"。
  no-git-layout:
    name: no-git layout（无 .git）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Remove .git（造非 git 布局）
        run: rm -rf .git

      - name: Default must fail（无 .git 默认判红）
        run: |
          if python scripts/selftest.py > /tmp/nogit_default.txt 2>&1; then
            echo "::error::无 .git 时默认返回 0 —— 静默绿回归，应判红"
            cat /tmp/nogit_default.txt
            exit 1
          fi
          echo "OK：无 .git 默认判红（符合预期）"

      - name: --allow-nogit degrades to note（降级路径须退出 0）
        run: python scripts/selftest.py --allow-nogit
